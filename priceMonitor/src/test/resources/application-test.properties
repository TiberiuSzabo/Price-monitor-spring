# Tests run on in-memory H2 in PostgreSQL mode. The real Flyway migration is
# applied and Hibernate validates the entities against it (ddl-auto=validate
# from application.properties), so a migration/entity mismatch fails the build.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Keep the scheduler from firing during tests.
pricemonitor.check-interval-ms=86400000
