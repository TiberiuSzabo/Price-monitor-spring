server.port=8081

# File-based H2, so tracked products and price history survive a restart.
spring.datasource.url=jdbc:h2:file:./data/pricedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# How often all products are re-checked, and the pause between two requests to eMAG.
pricemonitor.check-interval-ms=3600000
pricemonitor.delay-between-requests-ms=5000
pricemonitor.http-timeout-ms=10000
