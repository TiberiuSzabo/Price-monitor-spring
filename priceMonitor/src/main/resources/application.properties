# Shared by every profile. Anything environment-specific comes from environment
# variables; see .env.example in the repo root for the full list.
spring.application.name=price-monitor

# Running without SPRING_PROFILES_ACTIVE (IDE, mvnw spring-boot:run) means local development.
spring.profiles.default=dev

server.port=${SERVER_PORT:8081}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that the entities still match it, so drift fails at startup instead of at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator runs on its own port so operational endpoints are never served on the
# public API port. Only what is listed here is exposed.
management.server.port=${MANAGEMENT_PORT:9001}
# scrapecycle is the custom endpoint that starts a scrape cycle on demand.
management.endpoints.web.exposure.include=health,info,prometheus,scrapecycle
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Liveness/readiness are also published on the API port as /livez and /readyz,
# for load balancers that can only reach that port.
management.endpoint.health.probes.add-additional-paths=true
management.info.java.enabled=true
management.info.os.enabled=true
# Histogram buckets for HTTP latency, so Prometheus can compute p95/p99.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# How often all products are re-checked, and the pause between two requests to eMAG.
pricemonitor.check-interval-ms=${PRICEMONITOR_CHECK_INTERVAL_MS:3600000}
pricemonitor.delay-between-requests-ms=${PRICEMONITOR_DELAY_BETWEEN_REQUESTS_MS:5000}
pricemonitor.http-timeout-ms=${PRICEMONITOR_HTTP_TIMEOUT_MS:10000}
