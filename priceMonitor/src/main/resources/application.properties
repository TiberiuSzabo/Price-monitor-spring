# Shared by every profile. Anything environment-specific comes from environment
# variables; see .env.example in the repo root for the full list.
spring.application.name=price-monitor

# Running without SPRING_PROFILES_ACTIVE (IDE, mvnw spring-boot:run) means local development.
spring.profiles.default=dev

server.port=${SERVER_PORT:8081}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that the entities still match it, so drift fails at startup instead of at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# How often all products are re-checked, and the pause between two requests to eMAG.
pricemonitor.check-interval-ms=${PRICEMONITOR_CHECK_INTERVAL_MS:3600000}
pricemonitor.delay-between-requests-ms=${PRICEMONITOR_DELAY_BETWEEN_REQUESTS_MS:5000}
pricemonitor.http-timeout-ms=${PRICEMONITOR_HTTP_TIMEOUT_MS:10000}
