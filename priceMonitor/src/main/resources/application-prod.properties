# Production: no defaults for the database. A missing variable stops the app at
# startup instead of letting it run against the wrong database.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# One JSON object per log line (Elastic Common Schema) so a log collector can
# index fields without parsing free text. dev keeps the human-readable format.
logging.structured.format.console=ecs
