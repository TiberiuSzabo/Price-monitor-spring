name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the docker job asks for more.
permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: priceMonitor
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Restores ~/.m2 keyed on the pom, so dependencies are downloaded once.
          cache: maven
          cache-dependency-path: priceMonitor/pom.xml

      # Tests never call eMAG: the HTTP layer runs against WireMock and saved HTML
      # fixtures, the database is in-memory H2 with the real Flyway migration.
      - name: Build and run tests
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: priceMonitor/target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      # Publish only for pushes to the default branch (this repo uses master; main
      # is accepted too). Every other run still builds the image, so a broken
      # Dockerfile is caught in the pull request.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token, scoped to this repository - no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The action lower-cases the name, as the registry requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: priceMonitor
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache kept in the GitHub Actions cache: an unchanged pom.xml
          # means the Maven dependency layer is not rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max
