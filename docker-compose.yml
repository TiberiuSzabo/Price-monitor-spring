# Full local stack: app + PostgreSQL + Prometheus + Grafana.
#
#   docker compose up -d --build
#
# Every variable has a development default, so no .env file is needed.
# Copy .env.example to .env to override them.
name: price-monitor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricemonitor}
      POSTGRES_USER: ${POSTGRES_USER:-pricemonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricemonitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback only: lets you run the app from the IDE against this database.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  app:
    build:
      context: ./priceMonitor
    image: price-monitor:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pricemonitor}
      DB_USERNAME: ${POSTGRES_USER:-pricemonitor}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pricemonitor}
      PRICEMONITOR_CHECK_INTERVAL_MS: ${PRICEMONITOR_CHECK_INTERVAL_MS:-3600000}
      PRICEMONITOR_DELAY_BETWEEN_REQUESTS_MS: ${PRICEMONITOR_DELAY_BETWEEN_REQUESTS_MS:-5000}
      PRICEMONITOR_HTTP_TIMEOUT_MS: ${PRICEMONITOR_HTTP_TIMEOUT_MS:-10000}
    ports:
      # Public API.
      - "${APP_PORT:-8081}:8081"
      # Management port (health, metrics, manual scrape trigger): loopback only,
      # for local debugging. Prometheus reaches it over the compose network.
      # In a real deployment this line is removed.
      - "127.0.0.1:${MANAGEMENT_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9001/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          # The JVM sizes its heap as a percentage of this limit (see Dockerfile).
          memory: 512M
    networks:
      - backend
      - monitoring

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.15
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/price-monitor.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - monitoring

# Two networks so the monitoring tools cannot reach the database.
networks:
  backend:
  monitoring:

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
